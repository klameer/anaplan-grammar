[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anaplan-grammar"
version = "0.1.0"
description = "A grammar, parser, dependency graph, diff, linter and health report for Anaplan models, from their standard exports."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Karim Lameer" }]
keywords = ["anaplan", "formula", "parser", "grammar", "fp&a", "planning", "lint"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
anaplan-grammar = "anaplan_grammar.cli:main"

[project.urls]
Homepage = "https://github.com/klameer/anaplan-grammar"

[tool.hatch.build.targets.wheel]
packages = ["src/anaplan_grammar"]
